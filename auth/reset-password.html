<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create New Password - NovaTech Solutions</title>
    <!-- Fonts and Icons -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <!-- Supabase SDK -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <!-- CSS -->
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/auth.css">
</head>
<body>
    <div class="auth-container">
        <div class="auth-card">
            <div class="auth-header">
                <a href="../index.html" class="logo" style="display: flex;">
                    <i class="ph ph-hexagon-fill"></i>
                    NovaTech
                </a>
                <h1>New Password</h1>
                <p>Enter your new password below</p>
            </div>
            
            <div id="authAlert" class="auth-alert"></div>

            <form id="resetPasswordForm" class="auth-form" novalidate>
                <div class="form-group">
                    <label for="password">New Password</label>
                    <div class="password-input-wrapper">
                        <input type="password" id="password" name="password" placeholder="Min. 8 characters" required>
                        <button type="button" class="toggle-password" aria-label="Show password" onclick="togglePasswordVisibility('password')">
                            <i class="ph ph-eye"></i>
                        </button>
                    </div>
                    <span class="error-message" id="passwordError"></span>
                </div>

                <div class="form-group">
                    <label for="confirmPassword">Confirm Password</label>
                    <div class="password-input-wrapper">
                        <input type="password" id="confirmPassword" name="confirmPassword" placeholder="Repeat new password" required>
                        <button type="button" class="toggle-password" aria-label="Show password" onclick="togglePasswordVisibility('confirmPassword')">
                            <i class="ph ph-eye"></i>
                        </button>
                    </div>
                    <span class="error-message" id="confirmPasswordError"></span>
                </div>
                
                <button type="submit" class="btn btn-primary auth-btn" id="submitBtn">
                    <span class="btn-text">Update Password</span>
                    <span class="loader-spinner"></span>
                </button>
            </form>
            
        </div>
    </div>

    <!-- Scripts -->
    <script src="../js/config.js"></script>
    <script src="../js/supabase-client.js"></script>
    <script src="../js/auth.js"></script>
</body>
</html>
